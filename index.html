<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/icons/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/master.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>TaskFlow</title>
</head>
<body>
    <main>
        <header>
            <div class="brand-info header-heading">
            <h2>TaskFlow</h2>
        </div>
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search tasks,projects, or commands...">
            </div>
            <nav>
                <a href="#"><i class="fa-regular fa-bell"></i></a>
                <a href="#"><i class="fa-solid fa-list"></i></a>
                <button class="new-project">New Project</button>
            </nav>
        </header>
        <section id="app-view"></section>
    </main>
    <aside class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <i class="fa-regular fa-circle-check"></i>
        </div>
        <div class="brand-info">
            <h2>TaskFlow</h2>
            <span>Command Center</span>
        </div>
    </div>
    <button class="quick-add">
        <i class="fa-solid fa-plus"></i>
        <span>Quick Add</span>
    </button>
    <nav class="sidebar-nav">
    <a href="#" class="nav-item active" data-view="dashboard">
        <i class="fa-solid fa-table-cells-large"></i>
        <span>Dashboard</span>
    </a> 
    <a href="#" class="nav-item" data-view="tasks">
        <i class="fa-regular fa-clipboard"></i>
        <span>My Tasks</span>
    </a>
    
    <a href="#" class="nav-item" data-view="today">
        <i class="fa-regular fa-calendar"></i>
        <span>Today</span>
    </a>
    
    <a href="#" class="nav-item" data-view="focus">
        <i class="fa-regular fa-clock"></i>
        <span>Focus Mode</span>
    </a>
    

    </nav>
    <div class="sidebar-profile">
        <a href="#">
            <div class="profile-avatar">
            <img src="assets/imges/profile.jpeg" alt="Profile">
        </div>
        <div class="profile-info">
            <span>Profile</span>
        </div>
        </a>
    </div>
</aside>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
